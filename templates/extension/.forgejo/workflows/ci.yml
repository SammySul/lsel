# Runs on twelve's own Forgejo runner with the host's Nix; a public repository's GitHub copy is only a mirror.
name: ci
on: { pull_request: {}, push: { branches: [main] } }
jobs:
  check:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - run: nix develop -c bun install --frozen-lockfile
      - run: nix develop -c bun run check
      - run: nix develop -c bun run test
      - run: nix develop -c bun run build
      # builds the extension as a Nix package, its tests included
      - run: nix flake check

  # A version in package.json without its tag becomes a release with the built extension
  # as <name>.zip; any other push releases nothing.
  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - env: { TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          name=$(jq -r .name package.json)
          tag="v$(jq -r .version package.json)"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag is already released"
            exit 0
          fi
          nix develop -c bun install --frozen-lockfile
          nix develop -c bun run build
          (cd dist && nix develop .. -c zip -qr "../$name.zip" .)
          prev=$(git describe --tags --abbrev=0 2>/dev/null || true)
          body="## Install

          1. Download \`$name.zip\` below and unzip it
          2. Open the browser's extensions page (\`chrome://extensions\`)
          3. Turn on **Developer mode**, then **Load unpacked** and pick the unzipped folder

          ## Changes

          $(git log --format='- %s' "${prev:+$prev..}HEAD")"
          api="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY/releases"
          id=$(jq -n --arg tag "$tag" --arg sha "$GITHUB_SHA" --arg body "$body" \
            '{tag_name: $tag, target_commitish: $sha, name: $tag, body: $body}' |
            curl -fsS -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" --data @- "$api" | jq -r .id)
          curl -fsS -X POST -H "Authorization: token $TOKEN" -F "attachment=@$name.zip" "$api/$id/assets?name=$name.zip" |
            jq -r '"released '"$tag"' with \(.name), \(.size) bytes"'
