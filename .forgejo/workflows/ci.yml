# Runs on twelve's own runner, with the host's Nix.
name: ci
on: { pull_request: {}, push: { branches: [main] } }
jobs:
  check:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - run: nix flake check
      - run: nix develop -c bun run sync --check

  kit:
    runs-on: self-hosted
    defaults: { run: { working-directory: kit } }
    steps:
      - uses: actions/checkout@v7
      - run: nix develop -c bun install --frozen-lockfile
      - run: nix develop -c bun run check
      - run: nix develop -c bun run test
      - run: nix develop -c bun run build
      - run: nix develop -c bun run test:e2e
      - run: nix develop -c bun run package

  # A template is a whole project: it must pass its own CI as shipped. After publish, which may be
  # releasing the kit version it pins; on a pull request publish is skipped and they run anyway.
  template:
    needs: publish
    if: ${{ !cancelled() && !failure() }}
    runs-on: self-hosted
    defaults: { run: { working-directory: templates/web } }
    steps:
      - uses: actions/checkout@v7
      - run: nix develop -c bun install --frozen-lockfile
      - run: nix develop -c bun run check
      - run: nix develop -c bun run test
      - run: nix develop -c bun run build
      - run: nix develop -c bun run test:e2e
      - run: nix build .#default --no-link

  template-extension:
    needs: publish
    if: ${{ !cancelled() && !failure() }}
    runs-on: self-hosted
    defaults: { run: { working-directory: templates/extension } }
    steps:
      - uses: actions/checkout@v7
      - run: nix develop -c bun install --frozen-lockfile
      - run: nix develop -c bun run check
      - run: nix develop -c bun run test
      - run: nix develop -c bun run build
      - run: nix flake check

  # A kit version not yet in Forgejo's registry is published; any other push publishes nothing.
  publish:
    needs: kit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    defaults: { run: { working-directory: kit } }
    steps:
      - uses: actions/checkout@v7
      - run: nix develop -c bun install --frozen-lockfile
      - env:
          # the run's own token can't write packages: Forgejo wants the owner's
          NPM_CONFIG_TOKEN: "${{ secrets.PACKAGES_TOKEN }}"
        run: |
          registry="$GITHUB_SERVER_URL/api/packages/SammySul/npm/"
          version=$(jq -r .version package.json)
          if curl -fsS "${registry}@sammysul%2flsel" | jq -e --arg v "$version" '.versions[$v]' >/dev/null; then
            echo "@sammysul/lsel $version is already published"
            exit 0
          fi
          nix develop -c bun publish --registry "$registry"
