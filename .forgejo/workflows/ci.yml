# Runs on twelve's own runner, with the host's Nix. GitHub only mirrors this repository.
name: ci
on: { pull_request: {}, push: { branches: [main] } }
jobs:
  # every app's build, check and tests, the kit's, Biome and the palette; an app nothing touched is a cache hit
  check:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - run: nix flake check
      - name: yank-wars' test harness stays out of its production build
        run: '! grep -rlq -e __yw -e harness "$(nix build .#yank-wars --no-link --print-out-paths)/share/yank-wars/web"'

  browsers:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # the members changed since main's last green browsers run; every member when shared code changed
      - id: touched
        env: { TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: echo "filters=$(nix run .#touched)" >> "$GITHUB_OUTPUT"
      - if: steps.touched.outputs.filters != ''
        run: nix develop -c bun install --frozen-lockfile
      - if: steps.touched.outputs.filters != ''
        run: nix develop -c bun run ${{ steps.touched.outputs.filters }} build
      # every yank-wars oracle case in every browser, not the local default's sample of 40
      - if: steps.touched.outputs.filters != ''
        run: nix develop -c bun run ${{ steps.touched.outputs.filters }} test:e2e
        env: { YW_SAMPLE: all }
      - name: yank-wars' built server verifies a claim with its embedded worker and puzzles
        if: contains(steps.touched.outputs.filters, './apps/yank-wars')
        run: nix develop -c bun apps/yank-wars/server/smoke.ts "$(nix build .#yank-wars --no-link --print-out-paths)"

  # An app whose version has no <name>-v tag yet is released; `squares` deploys the newest tag.
  release:
    needs: [check, browsers]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - env: { TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: for dir in apps/*/; do nix run .#release -- "${dir%/}"; done
