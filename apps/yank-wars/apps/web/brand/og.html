<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../src/lsel/tokens.css" />
    <style>
      html,
      body {
        width: 1200px;
        height: 630px;
      }
      .card {
        height: 100%;
        padding: 96px 104px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 40px;
      }
      img {
        width: 132px;
        height: 132px;
      }
      h1 {
        margin: 0;
        font-size: 104px;
        font-weight: 700;
      }
      p {
        margin: 0;
        font-size: 34px;
        color: var(--subtle);
      }
      .bottom {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .score {
        font-size: 64px;
        font-weight: 700;
      }
      .score span {
        font-size: 36px;
        font-weight: 400;
        color: var(--subtle);
      }
      .url {
        font-size: 32px;
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="top">
        <img src="../public/favicon.svg" alt="" />
        <h1>Yank Wars</h1>
      </div>
      <p>Vim golf in the browser. Fewest keys wins.</p>
      <div class="bottom">
        <div class="score">4 <span>/ par 4</span></div>
        <div class="url">yankwars.app</div>
      </div>
    </div>
  </body>
</html>
