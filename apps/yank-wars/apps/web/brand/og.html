<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #0d1117;
        color: #e6edf3;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        box-sizing: border-box;
        height: 100%;
        padding: 96px 104px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 40px;
      }
      img {
        width: 132px;
        height: 132px;
      }
      h1 {
        margin: 0;
        font-family: Menlo, monospace;
        font-size: 104px;
        letter-spacing: -0.03em;
      }
      p {
        margin: 0;
        font-size: 40px;
        color: #8b949e;
      }
      .bottom {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-family: Menlo, monospace;
      }
      .score {
        font-size: 64px;
        font-weight: 700;
      }
      .score span {
        font-size: 36px;
        font-weight: 400;
        color: #8b949e;
      }
      .url {
        font-size: 32px;
        color: #f2cc60;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="top">
        <img src="../public/favicon.svg" alt="" />
        <h1>Yank Wars</h1>
      </div>
      <p>Vim golf in the browser. Fewest keys wins.</p>
      <div class="bottom">
        <div class="score">4 <span>/ par 4</span></div>
        <div class="url">yankwars.app</div>
      </div>
    </main>
  </body>
</html>
