name: ci
on: { pull_request: {}, push: { branches: [main] } }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - run: nix develop -c bun install --frozen-lockfile
      - run: nix develop -c bun run check
      - run: nix develop -c bun test
      - run: nix develop -c bun run oracle --check
      - run: nix develop -c bun run test:browser
      - run: nix develop -c bun test ./apps/web/e2e/flow.e2e.ts
      - run: nix develop -c bun test ./apps/web/e2e/parity.e2e.ts
      - run: nix develop -c bun run build
      - name: the test harness stays out of the production build
        run: "! grep -rlq -e __yw -e harness apps/web/dist"
