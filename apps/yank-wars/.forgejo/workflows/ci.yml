# Runs on twelve's own runner with the host's Nix. GitHub only mirrors this repository.
name: ci
on: { pull_request: {}, push: { branches: [main] } }
jobs:
  check:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - run: nix develop -c bun install --frozen-lockfile
      - run: nix develop -c bun run check
      - run: nix develop -c bun run test
      - run: nix develop -c bun run test:browser
      - run: nix develop -c bun run build
      - run: nix develop -c bun run test:e2e
      - run: nix build .#default --no-link
      - name: the test harness stays out of the production build
        run: "! grep -rlq -e __yw -e harness apps/web/dist"

  # A version in package.json without its tag becomes a release; any other push releases nothing.
  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - env: { TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: nix run --inputs-from . lsel#release
