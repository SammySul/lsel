# Runs on twelve's own Forgejo runner with the host's Nix; a public repository's GitHub copy is only a mirror.
name: ci
on: { pull_request: {}, push: { branches: [main] } }
jobs:
  # the flake's checks (the build, `bun run check` and `test`), then the browser tests in the dev shell
  check:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - run: nix flake check
      - run: nix develop -c bun install --frozen-lockfile
      - run: nix develop -c bun run build
      - run: nix develop -c bun run test:e2e

  # A version in package.json without its tag becomes a release; any other push releases nothing.
  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - env: { TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: nix run --inputs-from . lsel#release
